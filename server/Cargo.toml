[package]
name = "pearosd"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["ws", "macros"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
hostname = "0.4.2"
lol_html = "3.0.3"
mime_guess = "2.0.5"
percent-encoding = "2.3.2"
portable-pty = "0.9.0"
rand = "0.10.3"
rcgen = "0.14.10"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "charset", "gzip", "brotli", "deflate", "cookies", "stream"] }
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws-lc-rs", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.40.1"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
url = "2.5.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
